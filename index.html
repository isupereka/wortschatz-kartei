<head>

  <style>
    body {
        background: #dbe1dc;
        margin: 0;

<body>
  <div class="container">
    <h1>📚 Wortschatz-Kartei</h1>
    <p id="status">Загружаю словарь...</p>p>
  </div>
  
  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://raw.githubusercontent.com/isupereka/wortschatz-kartei/main/vocab_data.json');
    xhr.onload = function() {
        if (xhr.status === 200) {
              try {
                      var data = JSON.parse(xhr.responseText);
                      document.getElementById('status').textContent = '✓ ' + data.length + ' слов загружено';
                      document.getElementById('status').className = 'ok';
                      localStorage.setItem('vocab_data', xhr.responseText);
              } catch (e) {
                      document.getElementById('status').textContent = '❌ Ошибка JSON: ' + e.message;
                      document.getElementById('status').className = 'err';
              }
        } else {
              document.getElementById('status').textContent = '❌ Ошибка загрузки (HTTP ' + xhr.status + ')';
              document.getElementById('status').className = 'err';
        }
    };
    xhr.onerror = function() {
        document.getElementById('status').textContent = '❌ Ошибка сети';
        document.getElementById('status').className = 'err';
    };
    xhr.send();
  </script>
</body>
